spring.application.name=landon-hotel
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database=postgresql
spring.datasource.url=jdbc:postgresql://localhost:5432/landon
spring.datasource.username=${POSTGRES_DB_USERNAME}
spring.datasource.password=${POSTGRES_DB_PASSWORD}
eazzyconnect.apiKey=${EAZZYCONNECT_API_KEY}
eazzyconnect.apiUrl=https://eazzyconnect.com
